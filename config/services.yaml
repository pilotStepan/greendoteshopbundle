parameters:
  # GoPay defaults, so projects without GoPay keep booting (every gateway is instantiated by PaymentGatewayProvider).
  # Set the credentials in the project env. GOPAY_API_URL is optional: empty = sandbox in dev/test, production otherwise.
  env(GOPAY_CLIENT_ID): ''
  env(GOPAY_CLIENT_SECRET): ''
  env(GOPAY_GOID): '0'
  env(GOPAY_API_URL): ''

services:
  _defaults:
    autowire: true
    autoconfigure: true

  Greendot\EshopBundle\:
    resource: '../src/*'
    exclude: '../src/{DependencyInjection,Migrations,Tests,Kernel.php}'

  Greendot\EshopBundle\Controller\:
    resource: '../src/Controller'
    tags: ['controller.service_arguments']

  Greendot\EshopBundle\OpenApi\ShortCodeOpenApiFactory:
    decorates: 'api_platform.openapi.factory'
    arguments:
      $decorated: '@Greendot\EshopBundle\OpenApi\ShortCodeOpenApiFactory.inner'
    autoconfigure: false

  Greendot\EshopBundle\Service\PaymentGateway\GoPay\GoPayClient:
    arguments:
      $clientId: '%env(GOPAY_CLIENT_ID)%'
      $clientSecret: '%env(GOPAY_CLIENT_SECRET)%'
      $goId: '%env(GOPAY_GOID)%'
      $apiUrl: '%env(GOPAY_API_URL)%'
      $environment: '%kernel.environment%'

  Algolia\AlgoliaSearch\Api\SearchClient:
    factory: [ 'Algolia\AlgoliaSearch\Api\SearchClient', 'create' ]
    arguments:
      - '%env(ALGOLIA_APP_ID)%'
      - '%env(ALGOLIA_API_KEY)%'

  Greendot\EshopBundle\Algolia\ProductIndexerInterface:
    alias: 'Greendot\EshopBundle\Algolia\ProductIndexer'