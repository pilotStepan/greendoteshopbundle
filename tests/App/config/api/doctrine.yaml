doctrine:
    dbal:
        url: '%env(TEST_DATABASE_URL)%'
        types:
            array: Greendot\EshopBundle\Tests\App\Doctrine\LegacyArrayType
    orm:
        auto_generate_proxy_classes: true
        enable_lazy_ghost_objects: true
        naming_strategy: doctrine.orm.naming_strategy.underscore_number_aware
        mappings:
            GreendotEshopBundle:
                is_bundle: false
                type: attribute
                dir: '%kernel.project_dir%/src/Entity'
                prefix: 'Greendot\EshopBundle\Entity'
                alias: GreendotEshopBundle
        # Every bundle filter, registered and enabled the way tenants do (config/packages/doctrine.yaml).
        filters:
            !php/enum Greendot\EshopBundle\Doctrine\DoctrineFiltersConfigNames::ProductActiveFilter->value:
                class: Greendot\EshopBundle\Doctrine\ProductActiveFilter
                enabled: true
            !php/enum Greendot\EshopBundle\Doctrine\DoctrineFiltersConfigNames::ProductVariantActiveFilter->value:
                class: Greendot\EshopBundle\Doctrine\ProductVariantActiveFilter
                enabled: true
            !php/enum Greendot\EshopBundle\Doctrine\DoctrineFiltersConfigNames::ProductProductActiveFilter->value:
                class: Greendot\EshopBundle\Doctrine\ProductProductActiveFilter
                enabled: true
            !php/enum Greendot\EshopBundle\Doctrine\DoctrineFiltersConfigNames::TransportationIsEnabledFilter->value:
                class: Greendot\EshopBundle\Doctrine\TransportationIsEnabledFilter
                enabled: true
            !php/enum Greendot\EshopBundle\Doctrine\DoctrineFiltersConfigNames::CommentIsActiveFilter->value:
                class: Greendot\EshopBundle\Doctrine\CommentIsActiveFilter
                enabled: true
            !php/enum Greendot\EshopBundle\Doctrine\DoctrineFiltersConfigNames::TransportationActionTransportationIsEnabledFilter->value:
                class: Greendot\EshopBundle\Doctrine\TransportationActionTransportationIsEnabledFilter
                enabled: true
            !php/enum Greendot\EshopBundle\Doctrine\DoctrineFiltersConfigNames::SoftDeletedFilter->value:
                class: Greendot\EshopBundle\Doctrine\SoftDeletedFilter
                enabled: true
            # A tenant's own filter, next to the bundle's.
            payment_type_isEnabled:
                class: Greendot\EshopBundle\Tests\App\Doctrine\PaymentTypeIsEnabledFilter
                enabled: true
